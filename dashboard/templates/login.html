<!DOCTYPE html>

<html>

<head>

<title>DPI Login</title>

<style>

body{

font-family:Arial;

background:#0f172a;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}

.login{

background:white;

padding:40px;

border-radius:10px;

width:350px;

}

input{

width:100%;

padding:10px;

margin:10px 0;

}

button{

width:100%;

padding:12px;

background:#2563eb;

color:white;

border:none;

cursor:pointer;

}

</style>

</head>

<body>

<div class="login">

<h2>Enterprise DPI Login</h2>

<form method="POST">

<input
type="text"
name="username"
placeholder="Username"
required>

<input
type="password"
name="password"
placeholder="Password"
required>

<button type="submit">

Login

</button>

</form>

</div>

</body>

</html>
